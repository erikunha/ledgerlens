openapi: 3.1.0
info:
  title: LedgerLens Lab Demo API (proposed)
  version: 0.1.0
  description: Public educational demo endpoints, design-only; no live financial actions. Provider keys ephemeral.
servers:
- url: http://localhost:8000
  description: Local proposed service
paths:
  /v1/public/scenarios:
    get:
      summary: Published scenario catalog
      responses:
        '200':
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'
  /v1/public/replays/{replay_id}:
    get:
      summary: Published sanitized replay bundle
      responses:
        '200':
          description: Replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayBundle'
      parameters:
      - name: replay_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v1/public/evaluations:
    get:
      summary: Published evaluation manifests
      responses:
        '200':
          description: Versioned benchmark summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /v1/public/model-profiles:
    get:
      summary: Verified model profiles
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelProfile'
  /v1/sessions:
    post:
      summary: Start anonymous demo session
      responses:
        '201':
          description: Session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /v1/sessions/current:
    delete:
      summary: End session and purge keys/branches
      responses:
        '204':
          description: Session ended
      security:
      - anonymousSession: []
  /v1/sandboxes:
    post:
      summary: Create isolated sandbox
      responses:
        '201':
          description: Sandbox created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario_id:
                  type: string
                  pattern: ^S[0-9]{2}$
              required:
              - scenario_id
              additionalProperties: false
      security:
      - anonymousSession: []
  /v1/sandboxes/{sandbox_id}:
    get:
      summary: Read owned sandbox state
      responses:
        '200':
          description: Sandbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      security:
      - anonymousSession: []
  /v1/sandboxes/{sandbox_id}/ledger:
    get:
      summary: Read account-scoped simulation ledger
      responses:
        '200':
          description: Bounded ledger lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
                additionalProperties: false
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      security:
      - anonymousSession: []
  /v1/sandboxes/{sandbox_id}/mutations/preview:
    post:
      summary: Validate and preview mutation without writing
      responses:
        '200':
          description: Preview with impacted rows/invariants
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mutation'
      security:
      - anonymousSession: []
  /v1/sandboxes/{sandbox_id}/mutations:
    post:
      summary: Append typed sandbox mutation atomically
      responses:
        '200':
          description: Applied command with new revision and hash
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mutation'
      security:
      - anonymousSession: []
  /v1/sandboxes/{sandbox_id}/reset:
    post:
      summary: Reset sandbox to immutable snapshot
      responses:
        '200':
          description: Reset branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      security:
      - anonymousSession: []
  /v1/sessions/current/provider-credentials:
    post:
      summary: Register ephemeral BYOK key without persistence
      responses:
        '201':
          description: Ephemeral handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAccepted'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                  - openai
                  - anthropic
                  - google
                api_key:
                  type: string
                  minLength: 10
              required:
              - provider
              - api_key
              additionalProperties: false
      security:
      - anonymousSession: []
  /v1/sessions/current/provider-credentials/{handle}:
    delete:
      summary: Revoke ephemeral key
      responses:
        '204':
          description: Revoked
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      security:
      - anonymousSession: []
  /v1/runs:
    post:
      summary: Queue a bounded analysis run
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      security:
      - anonymousSession: []
  /v1/runs/{run_id}:
    get:
      summary: Read owned run status and optional final result
      responses:
        '200':
          description: Run envelope
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      security:
      - anonymousSession: []
  /v1/runs/{run_id}/events:
    get:
      summary: Live SSE event stream for owned run
      responses:
        '200':
          description: SSE stream of TraceEvent JSON
          content:
            text/event-stream:
              schema:
                type: string
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      security:
      - anonymousSession: []
  /v1/runs/{run_id}/cancel:
    post:
      summary: Request cancellation of owned run
      responses:
        '202':
          description: Cancellation requested
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      security:
      - anonymousSession: []
  /healthz:
    get:
      summary: Low-information health/readiness
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                required:
                - status
                additionalProperties: false
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        request_id:
          type: string
      required:
      - code
      - message
      - retryable
      - request_id
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
        mode_capabilities:
          type: array
          items:
            type: string
      required:
      - id
      - expires_at
      - mode_capabilities
      additionalProperties: false
    Scenario:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        modes:
          type: array
          items:
            type: string
      required:
      - id
      - title
      - description
      - modes
      additionalProperties: false
    Sandbox:
      type: object
      properties:
        id:
          type: string
        base_snapshot_id:
          type: string
        snapshot_sha256:
          type: string
        revision:
          type: integer
          minimum: 0
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - base_snapshot_id
      - snapshot_sha256
      - revision
      - expires_at
      additionalProperties: false
    Mutation:
      $ref: ./schemas/scenario-mutation.schema.json
    TraceEvent:
      $ref: ./schemas/trace-event.schema.json
    RunRequest:
      $ref: ./schemas/live-run-request.schema.json
    PublicResult:
      $ref: ./schemas/public-investigation-result.schema.json
    ModelProfile:
      $ref: ./schemas/model-profile.schema.json
    ReplayBundle:
      $ref: ./schemas/replay-bundle.schema.json
    RunAccepted:
      type: object
      properties:
        run_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
        events_url:
          type: string
        result_url:
          type: string
      required:
      - run_id
      - status
      - events_url
      - result_url
      additionalProperties: false
    CredentialAccepted:
      type: object
      properties:
        credential_handle:
          type: string
        provider:
          type: string
        expires_at:
          type: string
          format: date-time
        validation_status:
          type: string
      required:
      - credential_handle
      - provider
      - expires_at
      - validation_status
      additionalProperties: false
  responses:
    Error:
      description: Normalized error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    anonymousSession:
      type: apiKey
      in: cookie
      name: ledgerlens_session
      description: Opaque signed HttpOnly demo session cookie, not user identity.
