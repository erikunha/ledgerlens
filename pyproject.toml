[project]
name = "ledgerlens"
version = "0.1.0"
description = "Payment investigation agent: tools, memory, verification and evaluation on LangChain"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain==1.4.9",
    "langchain-core==1.7.6",
    "langchain-classic==1.0.8",
    "langchain-community==0.4.2",
    "langchain-openai==1.7.4",
    "langsmith==0.14.17",
    "faiss-cpu==1.15.1",
    "fastembed==0.9.1",
    "openevals>=0.2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sqlglot>=30.30",
    "httpx>=0.28",
    "tiktoken>=0.9",
    "numpy>=1.26",
    "holidays>=0.108",
    "Faker>=40.44",
    "openpyxl>=3.1.5",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.20",
]

[project.optional-dependencies]
verify = [
    "transformers>=5.22",
    "torch>=2.4",
]
api = [
    "fastapi>=0.162",
    "uvicorn>=0.30",
    # The driver of the sandbox store. It comes with the binary wheel, so the container needs no compiler.
    "psycopg[binary]>=3.2",
]
app = [
    "streamlit>=1.67",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "jsonschema>=4.23",
]

[project.scripts]
ledgerlens-sim = "ledgerlens.sim.cli:main"
ledgerlens-api = "ledgerlens.api.ledger_service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgerlens"]

[tool.uv]
# Overrides any user-level cutoff so the pinned versions resolve on every machine.
# Moves forward only when the lock file is refreshed on purpose.
exclude-newer = "2026-11-08T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -m 'not slow'"
filterwarnings = [
    "ignore:.*langchain-community. is being sunset.*:DeprecationWarning",
]
markers = [
    "slow: loads a real model or downloads files; run with `pytest -m slow`",
]
