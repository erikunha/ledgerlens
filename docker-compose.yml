services:
  postgres:
    # The image is pinned: the sandbox store runs against one known version of Postgres, in the local run and in
    # the continuous integration, so that the two behave the same.
    image: postgres:17-alpine
    container_name: ledgerlens-postgres
    environment:
      # The user and the name of the database travel with the url of the api, so the three never disagree: a
      # deployment that names a user and a database gets a url that points at them.
      #
      # Why the pieces are interpolated with the form `${VAR-default}` and not with the form `${VAR:-default}`:
      # the form with the colon puts a colon between the user and the host of the url of the api, and the guard
      # of the environment of the developer reads that colon as the colon of a password (see the url of the api).
      POSTGRES_USER: ${LEDGERLENS_SANDBOX_DB_USER-ledgerlens}
      # The container has no password: the port is published on the loopback only and the trust method is
      # enough for a local database of a development machine. A password in a repository is a secret that
      # has to be rotated, and this database has nothing that is worth a secret.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ${LEDGERLENS_SANDBOX_DB_NAME-ledgerlens_sandbox}
    ports:
      # The port is published on the loopback only: the store of the sandbox is not a public service.
      - "127.0.0.1:${LEDGERLENS_SANDBOX_DB_PORT:-5433}:5432"
    volumes:
      - ledgerlens-sandbox-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The gate waits for this, so the tests never run against a database that is still starting.
      test: ["CMD-SHELL", "pg_isready -U ${LEDGERLENS_SANDBOX_DB_USER-ledgerlens} -d ${LEDGERLENS_SANDBOX_DB_NAME-ledgerlens_sandbox}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  api:
    # The api of the visitor: the wired application of the demo (ADR-039), the process that holds the
    # credential vault of the live mode. It runs the image of the `Dockerfile`, it runs offline, and it
    # reads the store of the branches from the `postgres` service BY THE NAME of that service and not by
    # the published port: the published port is the way in from the machine, and the way in between the
    # services of the compose is the network of the compose.
    build:
      context: .
      dockerfile: Dockerfile
    image: ledgerlens-demo:local
    container_name: ledgerlens-api
    environment:
      # The image runs offline, so it never calls a provider and it needs no key.
      LEDGERLENS_OFFLINE: "1"
      # The store of the branches, by the name of the service of the database.
      #
      # Why the whole url is ONE variable: the url of a connection carries the user and the name of the database,
      # and this compose file declares both of them, so the url of the api carries them too and the three never
      # disagree. A deployment that changes the user or the name of the database changes this url with it, and a
      # deployment that points the api at another database changes the whole url with
      # `LEDGERLENS_SANDBOX_DATABASE_URL`.
      #
      # Why the connection carries NO password: the method of trust of the container of the database is enough,
      # and a password in a repository is a secret that has to be rotated.
      #
      # Why the pieces of the url are interpolated with the form `${VAR-default}` and not with the form
      # `${VAR:-default}`: the form with the colon puts a colon between the user and the host, and the guard of
      # the environment of the developer reads that colon as the colon of a password.
      #
      # What that guard is: the scanner of the environment of the developer, and it is the guard of the STAGED
      # files of a commit, not a scanner of the repository. It refuses a staged file that holds a connection string
      # of the shape `scheme://user:password@host`, and the connection of this compose is not of that shape.
      LEDGERLENS_SANDBOX_DATABASE_URL: ${LEDGERLENS_SANDBOX_DATABASE_URL:-postgresql://${LEDGERLENS_SANDBOX_DB_USER-ledgerlens}@postgres:5432/${LEDGERLENS_SANDBOX_DB_NAME-ledgerlens_sandbox}}
    depends_on:
      # The api waits for the healthcheck of the database, so it never reads a store that is still starting.
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "python scripts/apply_sandbox_schema.py && exec ledgerlens-demo --host 0.0.0.0 --port 8010"]
    ports:
      # The port is published on the loopback only: the demo is not a public service of the machine.
      - "127.0.0.1:8010:8010"
    volumes:
      # The runtime folder of the server: the key of the sessions of the wired application and the runtime
      # material of the sandbox live there, and they survive a restart of the container.
      - ledgerlens-runtime:/var/lib/ledgerlens
    restart: unless-stopped

  demo:
    build: .
    image: ledgerlens-demo:local
    command: ["uvicorn", "app.server:portal", "--host", "0.0.0.0", "--port", "8501"]
    environment:
      LEDGERLENS_OFFLINE: "1"
      LEDGERLENS_API_BASE_URL: http://api:8010
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ledgerlens-sandbox-pgdata:
  ledgerlens-runtime:

# The url of this container is the default of the setting `LEDGERLENS_SANDBOX_DATABASE_URL`:
# postgresql://ledgerlens@127.0.0.1:5433/ledgerlens_sandbox
# The schema of the store is applied with `uv run python scripts/apply_sandbox_schema.py`, which is safe to run
# twice. Inside the compose the api reads the same database by the name of the service, so the schema is applied
# with `docker compose run --rm api python scripts/apply_sandbox_schema.py`.
# The local run of the whole thing is `docker compose up -d`: the database, the api on the port 8010 and the site
# of the demo on the port 8501.
