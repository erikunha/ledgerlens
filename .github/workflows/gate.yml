name: gate

on:
  push:
    # The work of the v3 cycle goes straight into feature/v3, with no pull request, so the branch is listed here.
    # Without it the gate of this repository would never run for the work that is actually being made.
    branches: [main, feature/v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEDGERLENS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Cache local models (fastembed)
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('ledgerlens/embeddings.py', 'ledgerlens/config.py') }}
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra app --extra api
      - name: Gate (ruff, pytest offline)
        run: bash scripts/gate.sh
